<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f3e9">
<title>준봉 · 은서 결혼식</title>
<style>
/*
  목적: 청첩장 QR 랜딩페이지 정본 디자인을 보존한 모바일 단일 HTML.
  기능: 캘린더 3개 + 지도 3개 버튼 연동.
  변경 허용: 세로 간격 증가 / 층 표기 수정 / 승인 지도 교체 / 지도 소폭 하향 /
             지도앱 버튼 소폭 상향 / 앱 아이콘 올리브 단색 / 지도 CSS 테두리 제거 /
             지도 가장자리 약한 페이드.
  영향: 시각 배치와 해당 표기·지도 자산만 변경. 기존 6개 기능은 유지.
  위험: iOS 파일 미리보기와 실제 Safari는 폰트/버튼 렌더링이 조금 다를 수 있음.
  rollback: 이전 HTML로 교체하면 즉시 복구 가능.
*/
:root {
  --paper:#f8f3e9;
  --paper2:#fbf8f1;
  --ink:#171813;
  --olive:#737852;
  --olive-dark:#59613d;
  --line:#7d8063;
  --soft:#8b897f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{
  font-family:"Noto Serif CJK KR","NanumMyeongjo","AppleMyungjo","Batang",serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(255,255,255,.62),transparent 38rem),
    linear-gradient(180deg,var(--paper2) 0%,var(--paper) 100%);
}
.page{
  position:relative;
  width:min(100%,430px);
  margin:0 auto;
  overflow:hidden;
  padding:42px 22px 104px;
  min-height:100vh;
}
/* 장식 자산은 정본에서 직접 추출한 비주얼을 사용하여 모양·색감 변형을 방지 */
.decor{position:absolute;pointer-events:none;user-select:none;mix-blend-mode:multiply}
.decor.top-petal{width:43px;left:14px;top:96px;opacity:.88}
.decor.bottom-flower{width:64px;right:-2px;bottom:-6px;opacity:.93}
.decor.bottom-petal{width:34px;right:49px;bottom:83px;opacity:.88}
.hero{text-align:center;position:relative;z-index:1}
.hero-flower{display:block;width:124px;height:90px;object-fit:cover;margin:0 auto 13px;mix-blend-mode:multiply}
h1{margin:0;font-size:34px;line-height:1.22;font-weight:500;letter-spacing:.105em;white-space:nowrap}
.hero-meta{margin-top:31px;text-align:center;font-size:17px;line-height:2.02;letter-spacing:.02em}
.divider{display:grid;grid-template-columns:1fr 58px 1fr;align-items:center;gap:9px;margin:45px 0 27px}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);opacity:.88}
.divider img{width:58px;height:38px;object-fit:cover;justify-self:center;mix-blend-mode:multiply}
.section-title{margin:0;text-align:center;font-size:29px;line-height:1.25;font-weight:500;letter-spacing:.11em}
.calendar-buttons{margin-top:26px}
.button-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{
  -webkit-appearance:none;appearance:none;border:1.25px solid var(--olive-dark);border-radius:12px;
  background:rgba(255,255,255,.13);color:var(--ink);text-decoration:none;
  min-height:61px;padding:8px 5px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
  font:500 14.5px/1.1 "Noto Serif CJK KR","NanumMyeongjo","AppleMyungjo",serif;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.btn:active{background:rgba(115,120,82,.08);transform:translateY(1px)}
.calendar-buttons .btn{gap:0}
.directions-divider{margin-top:52px;margin-bottom:27px}
.address{margin-top:21px;text-align:center;font-size:16px;line-height:1.75;letter-spacing:.01em}
.address .venue{font-weight:500}
/* 요청: 주소/장소에서 지도까지 간격을 '조금' 늘려 지도만 소폭 하향 */
.map-shell{margin-top:34px;position:relative}
/* 요청: CSS border / outline / shadow는 사용하지 않음. 가장자리만 약한 soft fade */
.map-fade{
  position:relative;overflow:hidden;border:0;outline:0;box-shadow:none;border-radius:0;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 1.4%,#000 98.6%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0%,#000 1.4%,#000 98.6%,transparent 100%);
}
.map-fade::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(248,243,233,.14),transparent 3%,transparent 97%,rgba(248,243,233,.16));
}
.map-fade img{display:block;width:100%;height:auto;border:0}
/* 요청: 지도와 버튼 사이를 줄여 기존 정본보다 버튼을 지도 쪽으로 소폭 상향 */
.map-buttons{margin-top:24px;position:relative;z-index:2}
.map-buttons .btn{min-height:62px;font-size:13.8px}
.app-icon{width:25px;height:25px;flex:0 0 25px;color:var(--olive);display:grid;place-items:center}
.app-icon svg{display:block;width:100%;height:100%;fill:currentColor;stroke:currentColor}
/* 각 서비스의 실루엣은 유지하고 컬러만 올리브 단색 */
.app-icon.naver svg{fill:none;stroke-width:2.4;stroke-linejoin:round}
.app-icon.kakao svg{fill:var(--olive);stroke:none}
.app-icon.tmap svg{fill:var(--olive);stroke:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);width:min(calc(100% - 36px),390px);padding:12px 14px;border-radius:10px;background:rgba(38,39,33,.94);color:white;font-family:"Apple SD Gothic Neo",sans-serif;font-size:12px;text-align:center;opacity:0;pointer-events:none;transition:.18s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){
  .page{padding-left:16px;padding-right:16px}
  h1{font-size:26px}
  .hero-meta{font-size:13.7px}
  .section-title{font-size:23px}
  .btn{font-size:12.2px;min-height:50px}
  .map-buttons .btn{font-size:12.8px}
}
</style>
</head>
